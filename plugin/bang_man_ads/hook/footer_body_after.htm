if ($conf['FB_APP_ID']) {
?>
<script>

$(function(){
    
    if(!fbq) return;
$('.addCardBtn').on('click', function() {
    fbq('track', 'AddToCart');
    }, {
  test_event_code: "TEST65812" // 测试代码放在第三个参数对象
});

    $('#addCart').on('click', function() {


        var price=$("#price").attr('price')
        var tid=$("#addCart").attr('tid')
        fbq('track', 'AddToCart', {
            content_ids: [tid],
            content_type: "read",
            value: price,
            currency: "USD"
            }, {
  test_event_code: "TEST65812" // 测试代码放在第三个参数对象
});
    });


    $('#cart_checkout').on('click', function() { //
     fbq('track', 'InitiateCheckout');
    });

    $('#cart_payments').on('click', function() {
        var total = parseFloat($('#totalPrice').text()); 
        fbq('track', 'Purchase', {value: total, currency: 'USD'});
    });

   

});
</script>

<?php
}
