	$(function () {
		// 点击图片
		$('.cr-comment-text img').on('click', function () {
			const src = $(this).attr('src');
			if (!src) return;
			$('.img‑modal img').attr('src', src);
			$('.img‑modal').css('display', 'flex');
		});

		// 点击遮罩关闭弹窗
		$('.img‑modal').on('click', function () {
			$(this).hide();
		});
	});

</script>
